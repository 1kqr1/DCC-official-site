name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  # 部員ポータル（DCCadmin）の「HPに公開」ボタンから起動される
  repository_dispatch:
    types: [site-content-published]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 部員ポータルで公開されたHPの文章・リンク・画像を取り込む
          SITE_CONTENT_FETCH: '1'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dcc-official-site
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
